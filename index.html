<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Feud: Game Master Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="screen-menu" class="screen">
        <h1 class="main-title">FAMILY FEUD</h1>
        <div class="menu-buttons">
            <button class="btn-start" onclick="showScreen('screen-setup')">START STANDARD GAME</button>
            <button class="btn-extreme" onclick="startExtremeMode()">START EXTREME MODE</button>
            <button class="btn-editor" onclick="showScreen('screen-editor')">QUESTION EDITOR</button>
        </div>
    </div>

    <div id="screen-setup" class="screen hidden">
        <h2 class="section-title">TEAM REGISTRATION</h2>
        <div class="setup-grid">
            <div class="input-group">
                <label>TEAM 1 NAME</label>
                <input type="text" id="team1-name-input" value="TEAM APPLE">
            </div>
            <div class="input-group">
                <label>TEAM 2 NAME</label>
                <input type="text" id="team2-name-input" value="TEAM BANANA">
            </div>
        </div>
        <button class="btn-start" onclick="initGame()">LAUNCH GAME</button>
    </div>

    <div id="screen-editor" class="screen hidden">
        <h2 class="section-title">GAME CONTENT EDITOR</h2>
        <div id="editor-container" class="editor-scroll"></div>
        <button class="btn-start" onclick="saveData()">SAVE ALL CHANGES</button>
    </div>

    <div id="screen-game" class="screen hidden">
        <div class="game-header">
            <div class="team-card" id="team1-ui" onclick="selectTeam(1)">
                <h3 id="t1-label">TEAM 1</h3>
                <div class="score-val" id="t1-score">0</div>
            </div>
            <div class="strike-display" id="strike-dots"></div>
            <div class="team-card" id="team2-ui" onclick="selectTeam(2)">
                <h3 id="t2-label">TEAM 2</h3>
                <div class="score-val" id="t2-score">0</div>
            </div>
        </div>

        <div class="question-container">
            <h2 id="current-question">QUESTION TEXT GOES HERE</h2>
        </div>

        <div class="main-play-area">
            <div class="feud-board" id="board">
                </div>

            <div class="gm-controls">
                <div class="bank-box">
                    <small>ROUND BANK</small>
                    <div id="bank-total">0</div>
                </div>
                <button class="strike-trigger" onclick="triggerStrike()">
                    <span class="x-icon">✖</span><br>WRONG
                </button>
            </div>
        </div>

        <div class="footer-actions">
            <button id="btn-next-round" class="hidden" onclick="advanceRound()">AWARD BANK & NEXT ROUND</button>
        </div>
    </div>

    <div id="screen-end" class="screen hidden">
        <h1 class="main-title">FINAL RESULTS</h1>
        <div id="final-results" class="results-box"></div>
        <h2 class="thanks-msg">THANKS FOR PLAYING!</h2>
        <button class="btn-editor" onclick="location.reload()">RESTART GAME</button>
    </div>

    <div id="strike-overlay" class="strike-overlay"><div id="strike-x">X</div></div>

    <script src="script.js"></script>
</body>
</html>
